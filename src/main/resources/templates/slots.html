<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Available Slots</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<nav>
    <a href="/app">CareConnect</a>

    <span>
        <a href="/app/appointments"
           th:if="${user != null}">
            Appointments
        </a>

        <a href="/app/provider/slots/new"
           th:if="${user != null and (user.isProvider() or user.isAdmin())}">
            Add Availability
        </a>

        <a href="/login" th:if="${user == null}">
            Login
        </a>

        <form class="inline"
              action="/logout"
              method="post"
              th:if="${user != null}">
            <button type="submit">Logout</button>
        </form>
    </span>
</nav>

<main>

    <h1>Available Appointments</h1>

    <form class="filters"
          method="get"
          action="/app/slots">

        <label>
            Provider ID
            <input type="number"
                   name="providerId"
                   th:value="${providerId}">
        </label>

        <label>
            Service ID
            <input type="number"
                   name="serviceId"
                   th:value="${serviceId}">
        </label>

        <label>
            Date
            <input type="date"
                   name="date"
                   th:value="${date}">
        </label>

        <button class="button" type="submit">
            Filter
        </button>
    </form>

    <div class="grid">

        <article class="card"
                 th:each="slot : ${slots}">

            <p class="eyebrow"
               th:text="${slot.serviceName}">
                Service
            </p>

            <h2 th:text="${slot.providerName}">
                Provider
            </h2>

            <p th:text="${slot.specialization}">
                Specialization
            </p>

            <p>
                <strong>Date and time:</strong>
                <span th:text="${slot.startTime}">
                    Start time
                </span>
            </p>

            <p>
                <strong>Duration:</strong>
                <span th:text="${slot.durationMinutes}">
                    30
                </span>
                minutes
            </p>

            <p>
                <strong>Price:</strong>
                $<span th:text="${slot.price}">0.00</span>
            </p>

            <form th:if="${user != null and user.isCustomer()}"
                  th:action="@{/app/book/{id}(id=${slot.slotId})}"
                  method="post">

                <button class="button" type="submit">
                    Book Appointment
                </button>
            </form>

            <a th:if="${user == null}"
               href="/login">
                Login to book
            </a>

            <form th:if="${user != null and (user.isProvider() or user.isAdmin())}"
                  th:action="@{/app/provider/slots/{id}/remove(id=${slot.slotId})}"
                  method="post">

                <button type="submit">
                    Remove Slot
                </button>
            </form>

        </article>
    </div>

    <p th:if="${#lists.isEmpty(slots)}">
        No available slots found.
    </p>

    <div class="pagination">
        <a th:if="${page > 0}"
           th:href="@{/app/slots(page=${page - 1}, providerId=${providerId}, serviceId=${serviceId}, date=${date})}">
            Previous
        </a>

        <span>
            Page <span th:text="${page + 1}">1</span>
        </span>

        <a th:if="${slots.size() == 10}"
           th:href="@{/app/slots(page=${page + 1}, providerId=${providerId}, serviceId=${serviceId}, date=${date})}">
            Next
        </a>
    </div>

</main>

</body>
</html>
