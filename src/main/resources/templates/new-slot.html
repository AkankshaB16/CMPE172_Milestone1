<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Availability</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<nav>
    <a href="/app">CareConnect</a>
</nav>

<main class="card narrow">

    <h1>Add Availability Slot</h1>

    <form th:action="@{/app/provider/slots}"
          th:object="${slotForm}"
          method="post">

        <label>
            Service

            <select th:field="*{serviceId}">
                <option value="">Choose a service</option>

                <option th:each="service : ${services}"
                        th:value="${service.SERVICE_ID}"
                        th:text="${service.SERVICE_NAME}">
                </option>
            </select>
        </label>

        <label>
            Start Time

            <input type="datetime-local"
                   th:field="*{startTime}">
        </label>

        <label>
            End Time

            <input type="datetime-local"
                   th:field="*{endTime}">
        </label>

        <button class="button" type="submit">
            Create Slot
        </button>
    </form>

</main>

</body>
</html>
