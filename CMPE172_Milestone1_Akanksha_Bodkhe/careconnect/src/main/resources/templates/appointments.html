<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Appointments</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<nav>
    <a href="/app">CareConnect</a>

    <span>
        <a href="/app/slots">Available Slots</a>

        <form class="inline"
              action="/logout"
              method="post">
            <button type="submit">Logout</button>
        </form>
    </span>
</nav>

<main>

    <h1>Appointments</h1>

    <div class="card"
         th:each="appointment : ${appointments}">

        <h2 th:text="${appointment.serviceName}">
            Service
        </h2>

        <p>
            Provider:
            <span th:text="${appointment.providerName}">
                Provider
            </span>
        </p>

        <p>
            Patient:
            <span th:text="${appointment.customerName}">
                Patient
            </span>
        </p>

        <p>
            Time:
            <span th:text="${appointment.startTime}">
                Time
            </span>
        </p>

        <p>
            Status:
            <strong th:text="${appointment.status}">
                BOOKED
            </strong>
        </p>

        <form th:if="${user.isCustomer() and appointment.status == 'BOOKED'}"
              th:action="@{/app/appointments/{id}/cancel(id=${appointment.appointmentId})}"
              method="post">

            <button type="submit">
                Cancel Appointment
            </button>
        </form>

    </div>

    <p th:if="${#lists.isEmpty(appointments)}">
        No appointments found.
    </p>

</main>

</body>
</html>
