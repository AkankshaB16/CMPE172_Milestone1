spring.application.name=CareConnect
spring.datasource.url=jdbc:h2:mem:careconnect;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:seed.sql
spring.h2.console.enabled=true
server.port=8080

# Milestone 3 notification boundary. The default points to the mock controller
# in this application; deployment can override it with an environment variable.
notification.service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8080/notifications}
notification.client.max-attempts=${NOTIFICATION_MAX_ATTEMPTS:3}
notification.client.timeout-ms=${NOTIFICATION_TIMEOUT_MS:750}
