spring.application.name=CareConnect
spring.datasource.url=jdbc:h2:mem:careconnect;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:seed.sql
spring.h2.console.enabled=true
server.port=8080

# Milestone 3 notification boundary. The default points to the mock controller
# in this application; deployment can override it with an environment variable.
notification.service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8080/notifications}
notification.client.max-attempts=${NOTIFICATION_MAX_ATTEMPTS:3}
notification.client.timeout-ms=${NOTIFICATION_TIMEOUT_MS:750}
# Milestone 4 Gemini configuration
# The API key must be provided through an environment variable.
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.model.chat=none
spring.ai.google.genai.chat.model=${GEMINI_MODEL:gemini-2.5-flash}
spring.ai.google.genai.chat.temperature=0.2

# Autonomous reminder agent
careconnect.ai.reminders.cron=${AI_REMINDER_CRON:0 0 * * * *}
careconnect.ai.reminders.lookahead-hours=${AI_REMINDER_LOOKAHEAD_HOURS:48}